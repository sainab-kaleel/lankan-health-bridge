</head>
<body>
    <header>
        <div class="navbar" >
            <h1>Lankan Health Bridge</h1>
            <nav>
                <ul>
                    <li><a href="Homepage.html">Home</a></li>
                    <li><a href="Servicespage.html">Services</a></li>
                    <li><a href="Aboutpage.html">About Us</a></li>
                    <li><a href="Contactpage.html">Contact</a></li>
                </ul><br><br>
                  <!-- Add buttons below the navigation links -->
            <div class="nav-buttons">
                <!-- Wrap buttons with <a> tags to make them links -->

                <a href="Loginpage.html"><button class="btn">Log In</button></a>
            </div>
            </nav>
        </div>
    </header>
    <body>
<section class="login-section">
        <div class="login-container">
            <h2>Caregiver Login</h2>
           <div class="login-container">
  <form id="myForm">
      <table class="login-table" align="center">
        <tr>
          <td><label for="username">Username:</label></td>
          <td><input type="text" id="username" name="username" required></td>
        </tr>
        <tr>
          <td><label for="password">Password:</label></td>
          <td><input type="password" id="password" name="password" required></td>
        </tr>
        <tr>
          <td colspan="2" class="login-btn">
            <button type="button" class="Login-btn" onclick="window.location.href='Homepage.html';">Login</button>
            <button type="button" class="cancel-btn" id="cancelBtn">Cancel</button>
        </td>
      </tr>
      </table>
    </form>
    <script>
      // JavaScript to handle the Cancel button action
      document.getElementById('cancelBtn').addEventListener('click', function() {
          document.getElementById('myForm').reset();  // This clears all form fields
      });
  </script>
        </div>
</div>
</section>
