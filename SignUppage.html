<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caregiver System - Sign Up</title>
    <link rel="stylesheet" href="SignUppage.css">
</head>
    <!-- Navbar -->
    <header>
        <div class="navbar">
            <h1>Lankan Health Bridge</h1>
            <nav>
                <ul>
                    <li><a href="Homepage.html">Home</a></li>
                    <li><a href="Servicespage.html">Services</a></li>
                    <li><a href="Aboutpage.html">About Us</a></li>
                    <li><a href="Contactpage.html">Contact</a></li>
                </ul><br><br>
            </nav>
            <div class="nav-buttons">
                <a href="SignUppage.html"><button class="btn">Sign Up</button></a>
                <a href="Loginpage.html"><button class="btn">Log In</button></a>
            </div>
        </div>
    </header>
    <body>
    <div class="signup-section">
        <div class="signup-container">
            <h2>Sign Up</h2>
            <form>
                <table class="signup-table">
                    <!-- First Name -->
                    <tr>
                        <td><label for="first-name">First Name</label></td>
                        <td><input type="text" id="first-name" name="first-name" required></td>
                    </tr>
                    <!-- Last Name -->
                    <tr>
                        <td><label for="last-name">Last Name</label></td>
                        <td><input type="text" id="last-name" name="last-name" required></td>
                    </tr>
                    <!-- Email -->
                    <tr>
                        <td><label for="email">Email</label></td>
                        <td><input type="email" id="email" name="email" required></td>
                    </tr>
                    <!-- Password -->
                    <tr>
                        <td><label for="password">Password</label></td>
                        <td><input type="password" id="password" name="password" required></td>
                    </tr>
                    <!-- Confirm Password -->
                    <tr>
                        <td><label for="confirm-password">Confirm Password</label></td>
                        <td><input type="password" id="confirm-password" name="confirm-password" required></td>
                    </tr>
                    <!-- Submit Button -->
                    <tr>
                        <td colspan="2" class="form-btn">
                            <button type="submit">Sign Up</button>
                        </td>
                    </tr>
                </table>
            </form>
        </div>
    </div>
   
    <!-- Footer -->
    <footer>

    </footer>
</body>
</html>
