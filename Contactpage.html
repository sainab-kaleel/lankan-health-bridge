</head>
<body>
    <header>
        <div class="navbar">
            <h1>Lankan Health Bridge</h1>
            <nav>
                <ul>  
                    <li><a href="Homepage.html">Home</a></li>
                    <li><a href="Servicespage.html">Services</a></li>
                    <li><a href="Aboutpage.html">About Us</a></li>
                    <li><a href="Contactpage.html">Contact</a></li>

                  <!-- Add buttons below the navigation links -->

                <a href="Loginpage.html"><button class="btn">Log In</button></a>

    <section class="contact-section">
        <h1>Contact Us</h1>
        <p>If you have any questions or inquiries about our services, please use the form below to get in touch.</p>
        
        <form  class="contact-form">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Your Message</label>
            <textarea id="message" name="message" rows="5" required></textarea>

            <button type="submit" class="Submit" onclick="window.location.href='Homepage.html';">Submit Inquiry</button>
            
        </form>
    </section>

    <footer>
